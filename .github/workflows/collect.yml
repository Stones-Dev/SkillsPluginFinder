name: collect
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      source:
        description: 'Fuente a recoger (opcional; hoy solo github-search). Vacío = todas'
        required: false
        type: string

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run collector pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # El input va por una variable de entorno y no dentro del script: así un valor
          # con comillas o `$(...)` no se interpreta como shell. Vacío en el cron.
          SOURCE: ${{ inputs.source }}
        run: |
          if [ -n "$SOURCE" ]; then
            pnpm spf collect --source "$SOURCE"
          else
            pnpm spf collect
          fi

      - name: Commit and push changes
        run: |
          git config user.name "spf-bot"
          git config user.email "spf-bot@users.noreply.github.com"
          git add data
          git commit -m "chore(collect): $(date -u +%G-W%V)" || echo "No changes to commit"
          git push
