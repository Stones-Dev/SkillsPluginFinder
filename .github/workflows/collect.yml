name: collect
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      source:
        description: 'Fuente a recoger (opcional: github-search, awesome-list o anthropic-skills). Vacío = todas'
        required: false
        type: string

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Falla antes de gastar nada si la cuota del token no alcanza para una recogida:
      # 109 búsquedas (cubo `search`, 30 por minuto) y unas 250 peticiones de enrich
      # (cubo `core`; 80 repos x 3 = 240, 255 medidas) y, de awesome-list, 9 READMEs (un 304 no
      # cuenta) más hasta 300 `GET /repos` de enlaces nuevos. 600 deja margen. Si hay que subir
      # `enrich_max` en Intereses, sube también --min-core. Imprime los límites, nunca el token.
      - name: Check GitHub API quota
        env:
          GITHUB_TOKEN: ${{ secrets.SPF_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          TOKEN_NAME: ${{ secrets.SPF_GITHUB_TOKEN && 'SPF_GITHUB_TOKEN' || 'GITHUB_TOKEN automático de Actions' }}
        run: |
          echo "Token usado: $TOKEN_NAME"
          pnpm spf rate-limit --min-core 600 --min-search 30

      - name: Run collector pipeline
        env:
          # El secret SPF_GITHUB_TOKEN (un PAT de solo lectura) es opcional: si existe, se usa
          # en vez del token automático, que según la documentación de GitHub tiene 1.000 peticiones
          # por hora y repositorio.
          GITHUB_TOKEN: ${{ secrets.SPF_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # El input va por una variable de entorno y no dentro del script: así un valor
          # con comillas o `$(...)` no se interpreta como shell. Vacío en el cron.
          SOURCE: ${{ inputs.source }}
        run: |
          if [ -n "$SOURCE" ]; then
            pnpm spf collect --source "$SOURCE"
          else
            pnpm spf collect
          fi

      - name: Commit and push changes
        run: |
          git config user.name "spf-bot"
          git config user.email "spf-bot@users.noreply.github.com"
          git add data
          git commit -m "chore(collect): $(date -u +%G-W%V)" || echo "No changes to commit"
          git push
